# =============================================================================
# Prior period predictions per concept family.
#
# OUTPUT-ONLY: this table feeds the `period_match` column in Stage 2a results.
# It NEVER enters the test itself. The Stage 2a algorithm always discovers the
# period from data via Whittle max-over-frequencies. This file only records what
# we *predict* the discovered period will be, based on:
#   - Kantamneni & Tegmark 2024 (KT) — digit helix at period 10 in GPT-J
#   - Parent project Phase G (`/home/anshulk/arithmetic-geometry`) — empirical
#     periods discovered on Llama 3.1 8B
#   - Mathematical constraints — column algebra and carry-domain reasoning
#
# Each concept maps to a list of acceptable predicted periods (within 1 Fourier
# bin of the discovered period counts as `period_match = True`). If the
# discovered period is outside the list, `period_match = False` and the cell
# appears in `unexpected_periods.csv` for review.
#
# Concepts not listed here get `prior_predicted_period = []` and always match
# (no prediction to falsify).
# =============================================================================

