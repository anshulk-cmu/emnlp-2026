# =============================================================================
# EMNLP 2026 Pipeline Configuration
# Project: From Linear Probes to Bayesian Manifolds: Geometry of Arithmetic in Language Models
# Authors: Anshul Kumar (CMU, primary), Deeksha Varshney (IIT Jodhpur, advisor),
#          Manoj Kumar (IIT Roorkee, advisor), Barnabás Póczos (CMU, main advisor)
# Rescope of /home/anshulk/arithmetic-geometry under plan v6.
# =============================================================================

paths:
  workspace:    /home/anshulk/emnlp2026
  data_root:    /data/user_data/anshulk/emnlp2026
  models_root:  /data/user_data/anshulk/emnlp2026/models
  results_root: /data/user_data/anshulk/emnlp2026/results
  logs_root:    /data/user_data/anshulk/emnlp2026/logs

env:
  conda_env_name: geometry
  conda_env_path: /data/user_data/anshulk/miniconda3/envs/geometry
  python_bin:     /data/user_data/anshulk/miniconda3/envs/geometry/bin/python

models:
  - key: gpt-j-6b
    name: GPT-J 6B
    local_path: /data/user_data/anshulk/emnlp2026/models/gpt-j-6b
    hf_repo: EleutherAI/gpt-j-6B
    headline_layer: 14
    layers: [4, 8, 14, 20, 24]
  - key: llama-3.1-8b
    name: Llama 3.1 8B
    local_path: /data/user_data/anshulk/emnlp2026/models/llama-3.1-8b
    hf_repo: meta-llama/Llama-3.1-8B
    headline_layer: 16
    layers: [4, 8, 16, 24, 28]
  - key: pythia-6.9b
    name: Pythia 6.9B
    local_path: /data/user_data/anshulk/emnlp2026/models/pythia-6.9b
    hf_repo: EleutherAI/pythia-6.9b
    headline_layer: 16
    layers: [4, 8, 16, 24, 28]

dataset:
  operand_range: [0, 99]                # a, b ∈ [0, 99] for both tasks (plan v6 §4)
  prompts:
    addition:       "Output ONLY a number. {a}+{b}="
    multiplication: "Output ONLY a number. {a}*{b}="

tokenization:
  sweep_max: 10000                      # answers cover 0..198 (add) and 0..9801 (mult)
  contexts:
    - bare                              # tok(str(n))
    - leading_space                     # tok(" " + str(n))
    - post_equals                       # tok("=" + str(n))
    - post_plus                         # tok("+" + str(n))
    - post_star                         # tok("*" + str(n))
    - kt_addition_full                  # tok(prompt_with_answer) - tok(prompt)
    - kt_multiplication_full            # same with "*"

storage:
  activation_dtype: float32

eval:
  batch_size: 512                       # sized for A6000 ≥70% util on 6-8B models in bf16
  min_batch_size: 64                    # OOM-fallback floor
  max_new_tokens: 4                     # we only score first-token correctness
  inference_dtype: bfloat16             # weights loaded in bf16

ccsvd:
  min_group_size: 30                    # plan v6 §7.4: drop concept values with < 30 samples
  n_permutations: 1000                  # permutation null shuffles
  perm_alpha: 0.01                      # p<0.01 ⇒ 99th percentile of null
  cv_n_splits: 5                        # 5-fold subspace-preservation CV
  random_state: 42
  mean_centre: true
  unit_normalise: false                 # do NOT unit-norm rows
  centroid_weighting: "n_v"             # plan v6 spec: scale by sqrt(n_v / N)
  n_jobs: 1                             # GPU SVD batching is the speed driver; loky workers contend for CUDA context

lda:
  modes: ["off", "answer", "norm"]      # three residualization modes; quoted so YAML doesn't parse "off" as False
  scatter_choice: S_T                   # decided; λ_T ∈ [0,1]; S_T permutation-invariant
  placements: [subspace, full_space]    # Option A (subspace) and Option B (full 4096-D)
  regularisation_alpha: 1.0e-4          # for A: alpha * trace(S_T_z)/r added to S_T_z
  use_shrinkage_when_n_over_r_below: 10
  full_space_shrinkage: ledoit_wolf     # for B: mandatory at d=4096
  n_permutations: 1000                  # match CCSVD
  perm_alpha: 0.01                      # 99th percentile sequential stop
  cv_n_splits: 5
  cv_knn_k: [1, 5]                      # k-NN settings for CV accuracy
  use_one_se_rule_for_n_sig_cv: true
  bootstrap_n: 200
  random_state: 42
  min_classes_for_lda: 2
  min_samples_per_class: 30             # match CCSVD MIN_GROUP_SIZE
  ans_concept_prefixes: [ans_, answer]  # mode=answer carves out (residualizing answer onto answer-derived concepts is circular)
  norm_carveout_concepts: [ans_magnitude_tier]   # mode=norm carves out magnitude concept
  skip_cv_for_full_space: true          # Option B: rebuilding 4096² S_T per fold is expensive; B's role is direction audit, eigenvalues already not cited
  use_gpu_permutation_null_full_space: true  # Option B permutation null: cupy cho_solve when available

residualization:
  enabled_modes: [answer, norm]         # off is a passthrough; only fit OLS for these
  cache_dtype: float32                  # match activation dtype

stage2a:
  # Stage 2a — Centroid Fourier helix fit (discover-then-fit, Whittle null).
  # Period is discovered from the data via DFT periodogram argmax; the Whittle
  # max-over-frequencies null bakes the free-period search into the null itself.
  # The prior period table at `prior_period_table_path` is OUTPUT-ONLY — never
  # enters the test.
  n_permutations: 1000                  # Whittle null shuffles (matches CCSVD/LDA standard)
  perm_alpha: 0.01                      # per-coord p-value gate against max-over-freq null
  fdr_alpha: 0.05                       # BH-FDR threshold on q_helix, q_two_axis
  fcr_threshold: 0.30                   # in-cell helix/circle pass gate (relative)
  two_axis_alpha: 0.01                  # both periodic-coord p-values must be < this
  linear_alpha: 0.01                    # linear-pitch coord p-value gate
  min_K_for_fft: 4                      # K < 4 → no Fourier (verdict = low_K); K_natural reported regardless
  min_group_size: 30                    # match ccsvd.min_group_size for centroid filter
  redraw_rate_max: 0.10                 # null_unstable flag if > this fraction of perms redrawn
  redraw_attempt_cap: 100               # per shuffle slot; if still failing, mark null_unstable
  concordance_bin_tolerance: 1          # top-2 coords within ±1 Fourier bin → period_concordant
  vote_winner_margin: 2.0               # winning period must beat runner-up by this ratio (else period_inconsistent)
  variants: ["lda_a", "ccsvd"]          # two subspace sources per cell (sensitivity analysis)
  store_full_null_only_for_detections: true  # disk economy: only helix/circle cells keep full null spectra
  prior_period_table_path: configs/prior_periods.yaml
  random_state: 42                      # base seed; per-cell seed derived via sha256(model|task|...)

stage2b:
  # Stage 2b — Spread-aware Mahalanobis test (d_SW). Per-cell ρ_centroid between
  # Euclidean centroid distances and spread-aware (Mahalanobis-style) distances.
  # Discover-then-fit: Stage 2a's discovered period and axes are inherited; Stage
  # 2b discovers the within-class spread structure data-adaptively and fits d_SW
  # confirmatorily.
  # Run on full data — no subsampling. Bootstrap is WITH replacement at size N.
  n_permutations: 1000                  # label-permutation null on ρ_centroid
  n_bootstrap: 1000                     # bootstrap CI on ρ_centroid (with replacement, size N)
  lambda_factor: 1.0e-6                 # Tikhonov λ = lambda_factor * tr(Σ_pool)/r
  shrinkage_lw_threshold: 10            # ratio_v = n_v/r ≥ 10 → sample; else LW
  shrinkage_oas_threshold: 5            # ratio_v < 5 → OAS (Chen et al. 2010)
  rho_pass_threshold: 0.85              # ρ_centroid pass gate (plan §3.2.2)
  rho_low_ci_threshold: 0.70            # bootstrap 95% CI lower bound pass gate
  rho_marginal_low: 0.50                # ρ_low below this → centroid_only regardless
  ci_halfwidth_unstable: 0.30           # null_unstable if (ρ_high − ρ_low) / 2 > this
  fdr_alpha: 0.05                       # BH-FDR threshold on q_dsw
  min_group_size: 30                    # per-value floor; matches Stage 2a
  bootstrap_min_n_v_floor: 5            # below this in a bootstrap draw → reject & redraw
  bootstrap_max_redraws: 100            # cap on per-draw redraw attempts
  min_K_for_dsw: 4                      # K_present floor (Stage 2a inheritance)
  loo_runlist_band: 0.05                # B.8 LOO restricted to cells with |ρ−0.85| < band
  shrinkage_cutpoint_sweep: [3, 5, 8, 10, 15]   # appendix sensitivity sweep
  shrinkage_cutpoint_n_cells: 5         # 5 highest-N cells per layer
  variants: ["lda_a", "ccsvd"]
  modes: ["off", "answer", "norm"]
  # Confidence tiers (orthogonal to verdict)
  tier_high_min_K: 6
  tier_high_min_n_v: 100
  tier_high_min_ratio: 10
  tier_high_q_threshold: 0.01
  tier_high_rho_low: 0.80
  tier_medium_min_K: 5
  tier_medium_min_n_v: 50
  tier_medium_min_ratio: 5
  tier_medium_q_threshold: 0.05
  tier_medium_rho_low: 0.70
  tier_discovery_only_max_ratio: 2      # any value with ratio_v < 2 → DISCOVERY_ONLY
  # Toys
  toy_calibration_path: configs/stage2b.yaml  # written by check_stage2b_toys.py
  toy_5b_target_rho: 0.80               # legacy; superseded by toy_5b_extreme_max_rho
  toy_5b_extreme_max_rho: 0.85          # at the largest sweep scale, median ρ must be < this (pass gate)
  toy_5b_scale_sweep: [1.0, 5.0, 20.0, 50.0]   # std of per-VALUE anisotropic noise along random per-value direction
  toy_5b_n_seeds: 3
  toy_7b_n_cells: 100                   # binomial 95% CI [2, 11] around 5% nominal
  toy_7b_lower: 2
  toy_7b_upper: 11
  store_full_null_only_for_detections: true
  random_state: 42
