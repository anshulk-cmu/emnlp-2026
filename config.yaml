# =============================================================================
# EMNLP 2026 Pipeline Configuration
# Project: From Linear Probes to Bayesian Manifolds: Geometry of Arithmetic in LMs
# Rescope of /home/anshulk/arithmetic-geometry under plan v6.
# =============================================================================

paths:
  workspace:    /home/anshulk/emnlp2026
  data_root:    /data/user_data/anshulk/emnlp2026
  models_root:  /data/user_data/anshulk/emnlp2026/models
  results_root: /data/user_data/anshulk/emnlp2026/results
  logs_root:    /data/user_data/anshulk/emnlp2026/logs

env:
  conda_env_name: geometry
  conda_env_path: /data/user_data/anshulk/miniconda3/envs/geometry
  python_bin:     /data/user_data/anshulk/miniconda3/envs/geometry/bin/python

models:
  - key: gpt-j-6b
    name: GPT-J 6B
    local_path: /data/user_data/anshulk/emnlp2026/models/gpt-j-6b
    hf_repo: EleutherAI/gpt-j-6B
    headline_layer: 14
    layers: [4, 8, 14, 20, 24]
  - key: llama-3.1-8b
    name: Llama 3.1 8B
    local_path: /data/user_data/anshulk/emnlp2026/models/llama-3.1-8b
    hf_repo: meta-llama/Llama-3.1-8B
    headline_layer: 16
    layers: [4, 8, 16, 24, 28]
  - key: pythia-6.9b
    name: Pythia 6.9B
    local_path: /data/user_data/anshulk/emnlp2026/models/pythia-6.9b
    hf_repo: EleutherAI/pythia-6.9b
    headline_layer: 16
    layers: [4, 8, 16, 24, 28]

dataset:
  operand_range: [0, 99]                # a, b ∈ [0, 99] for both tasks (plan v6 §4)
  prompts:
    addition:       "Output ONLY a number. {a}+{b}="
    multiplication: "Output ONLY a number. {a}*{b}="

tokenization:
  sweep_max: 10000                      # answers cover 0..198 (add) and 0..9801 (mult)
  contexts:
    - bare                              # tok(str(n))
    - leading_space                     # tok(" " + str(n))
    - post_equals                       # tok("=" + str(n))
    - post_plus                         # tok("+" + str(n))
    - post_star                         # tok("*" + str(n))
    - kt_addition_full                  # tok(prompt_with_answer) - tok(prompt)
    - kt_multiplication_full            # same with "*"

storage:
  activation_dtype: float32

eval:
  batch_size: 512                       # sized for A6000 ≥70% util on 6-8B models in bf16
  min_batch_size: 64                    # OOM-fallback floor
  max_new_tokens: 4                     # we only score first-token correctness
  inference_dtype: bfloat16             # weights loaded in bf16

ccsvd:
  min_group_size: 30                    # plan v6 §7.4: drop concept values with < 30 samples
  n_permutations: 1000                  # permutation null shuffles
  perm_alpha: 0.01                      # p<0.01 ⇒ 99th percentile of null
  cv_n_splits: 5                        # 5-fold subspace-preservation CV
  random_state: 42
  mean_centre: true
  unit_normalise: false                 # do NOT unit-norm rows
  centroid_weighting: "n_v"             # plan v6 spec: scale by sqrt(n_v / N)
  n_jobs: 1                             # GPU SVD batching is the speed driver; loky workers contend for CUDA context

lda:
  modes: [off, answer, norm]            # three residualization modes run in parallel
  scatter_choice: S_T                   # decided; λ_T ∈ [0,1]; S_T permutation-invariant
  placements: [subspace, full_space]    # Option A (subspace) and Option B (full 4096-D)
  regularisation_alpha: 1.0e-4          # for A: alpha * trace(S_T_z)/r added to S_T_z
  use_shrinkage_when_n_over_r_below: 10
  full_space_shrinkage: ledoit_wolf     # for B: mandatory at d=4096
  n_permutations: 1000                  # match CCSVD
  perm_alpha: 0.01                      # 99th percentile sequential stop
  cv_n_splits: 5
  cv_knn_k: [1, 5]                      # k-NN settings for CV accuracy
  use_one_se_rule_for_n_sig_cv: true
  bootstrap_n: 200
  random_state: 42
  min_classes_for_lda: 2
  min_samples_per_class: 30             # match CCSVD MIN_GROUP_SIZE
  ans_concept_prefixes: [ans_, answer]  # mode=answer carves out (residualizing answer onto answer-derived concepts is circular)
  norm_carveout_concepts: [ans_magnitude_tier]   # mode=norm carves out magnitude concept
  skip_cv_for_full_space: true          # Option B: rebuilding 4096² S_T per fold is expensive; B's role is direction audit, eigenvalues already not cited
  use_gpu_permutation_null_full_space: true  # Option B permutation null: cupy cho_solve when available

residualization:
  enabled_modes: [answer, norm]         # off is a passthrough; only fit OLS for these
  cache_dtype: float32                  # match activation dtype
